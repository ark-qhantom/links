name = "qhantom-waitlist"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Not deployed. Before deploying: create the D1 database, paste its id below,
# set the RATE_SALT secret, and choose the route. See README.md.

[vars]
# Exact site origins allowed to post from a browser, comma separated.
ALLOWED_ORIGINS = "https://qhantom.com,https://www.qhantom.com"
# Bump when the consent sentence on the form changes.
CONSENT_TEXT_VERSION = "draft-1"

[[d1_databases]]
binding = "DB"
database_name = "qhantom-waitlist"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"
