name = "qhantom-waitlist"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Deployed 18 Nov 2026 to qhantom-waitlist.qhantomcorporation.workers.dev only.
# No route on qhantom.com and no DNS change has been made; both need approval.
# The first deploy went through the Cloudflare connector, so D1 has no record of
# migration 0001. Re-applying it is harmless (CREATE TABLE IF NOT EXISTS).

[vars]
# Exact site origins allowed to post from a browser, comma separated.
ALLOWED_ORIGINS = "https://qhantom.com,https://www.qhantom.com"
# Bump when the consent sentence on the form changes.
CONSENT_TEXT_VERSION = "draft-1"

[[d1_databases]]
binding = "DB"
database_name = "qhantom-waitlist"
database_id = "effe4be9-186f-4363-832a-fa4de40fc098"
migrations_dir = "migrations"
